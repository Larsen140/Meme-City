<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meme City Steuerung</title>
<style>
  :root { --bg: #14122b; --card: #1f1c42; --line: #37336b; --text: #f3f1ff; --muted: #a9a4d6; --pink: #ff3d7f; --gold: #ffc93c; --mint: #3df5b0; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
  h1 { grid-column: 1 / -1; margin: 0; font-size: 28px; } h1 span { color: var(--pink); }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  h2 { margin: 0 0 10px; font-size: 17px; color: var(--gold); }
  label { display: block; font-size: 13px; color: var(--muted); margin: 8px 0 4px; }
  input, select { width: 100%; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--line); background: #15132f; color: var(--text); font-size: 15px; }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  button { padding: 9px 14px; border-radius: 10px; border: 0; background: var(--pink); color: #fff; font-weight: 700; cursor: pointer; font-size: 14px; }
  button.alt { background: #39357a; } button.gold { background: var(--gold); color: #1b1240; }
  button:active { transform: scale(.97); }
  .status { display: flex; gap: 8px; align-items: center; margin: 6px 0; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #c33; flex: none; } .dot.on { background: var(--mint); }
  #log { font: 13px/1.4 ui-monospace, monospace; color: var(--muted); max-height: 220px; overflow: auto; }
  a { color: var(--mint); }
  ol { margin: 0; padding-left: 22px; }
</style>
</head>
<body>
<main>
  <h1><span>Meme City</span> · Steuerung &amp; Testmodus</h1>

  <section>
    <h2>Verbindungen</h2>
    <div class="status"><div class="dot" id="mcDot"></div><div>Minecraft: <b id="mcText">…</b></div></div>
    <div class="status"><div class="dot" id="ttDot"></div><div>TikTok: <b id="ttText">…</b></div></div>
    <div class="btns">
      <button onclick="post('/api/tiktok/connect')">TikTok verbinden</button>
      <button class="alt" onclick="post('/api/tiktok/disconnect')">Trennen</button>
      <button class="alt" onclick="post('/api/camera/overview')">Kamera: Übersicht</button>
    </div>
    <label>Links für TikTok LIVE Studio (Quelle „Link“ / Browser)</label>
    <div><a href="/overlay.html" target="_blank">/overlay.html</a> · Vorschau mit Hintergrund: <a href="/overlay.html?preview" target="_blank">/overlay.html?preview</a></div>
  </section>

  <section>
    <h2>Test-Zuschauer</h2>
    <label>TikTok-Name</label>
    <input id="user" value="testzuschauer">
    <div class="btns">
      <button class="alt" onclick="randomUser()">Zufälliger Name</button>
    </div>
    <div class="btns">
      <button onclick="sim('chat', { text: 'Haus' })">Chat: „Haus“</button>
      <button onclick="sim('chat', { text: 'Zeig mal mein Haus' })">Chat: „Zeig mein Haus“</button>
      <button onclick="sim('follow')">Folgt</button>
    </div>
    <div class="btns">
      <button class="alt" onclick="sim('like', { count: 15 })">+15 Likes</button>
      <button class="alt" onclick="sim('like', { count: 100 })">+100 Likes</button>
      <button class="alt" onclick="sim('like', { count: 1000 })">+1000 Likes</button>
    </div>
    <div class="btns">
      <button class="gold" onclick="sim('gift', { gift: 'rose' })">Rose (1)</button>
      <button class="gold" onclick="sim('gift', { gift: 'donut' })">Donut (30)</button>
      <button class="gold" onclick="sim('gift', { gift: 'herz' })">Herz-Hände (100)</button>
      <button class="gold" onclick="sim('gift', { gift: 'universe' })">Universe (1000)</button>
    </div>
    <label>Eigene Chat-Nachricht</label>
    <div style="display:flex;gap:8px"><input id="chat" placeholder="z. B. wo ist mein haus"><button onclick="sim('chat', { text: $('chat').value })">Senden</button></div>
  </section>

  <section>
    <h2>Bürgermeister</h2>
    <label>Etwas sagen lassen</label>
    <div style="display:flex;gap:8px"><input id="say" placeholder="Hallo Meme City!"><button onclick="post('/api/say', { text: $('say').value })">Sprechen</button></div>
    <h2 style="margin-top:16px">Stadt</h2>
    <div>Häuser: <b id="houses">0</b> · Bürger: <b id="citizens">0</b></div>
    <div id="comm" style="margin:6px 0"></div>
    <ol id="top"></ol>
    <div class="btns"><button class="alt" onclick="if(confirm('Alle Häuser ohne Animation neu bauen?')) post('/api/rebuild')">Alle Häuser neu bauen</button></div>
    <h2 style="margin-top:16px">Events von Hand</h2>
    <div class="btns">
      <button class="gold" onclick="post('/api/event/Tornado')">Tornado</button>
      <button class="gold" onclick="post('/api/event/Meteorregen')">Meteorregen</button>
      <button class="gold" onclick="post('/api/event/Feuerwerk-Show')">Feuerwerk-Show</button>
      <button class="gold" onclick="post('/api/event/Regenbogen')">Regenbogen</button>
      <button class="gold" onclick="post('/api/event/Schneesturm')">Schneesturm</button>
      <button class="gold" onclick="post('/api/event/Party')">Party</button>
    </div>
  </section>

  <section>
    <h2>Ereignisse</h2>
    <div id="log"></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const post = (url, body = {}) => fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
const sim = (kind, extra = {}) => post('/api/sim/' + kind, { user: $('user').value, ...extra });
const NAMES = ['timo', 'nastjaxd', 'lukas.mc', 'emma_2010', 'ben.builder', 'mia.memes', 'kevin_kartoffel', 'lena.lol', 'paul_pixel', 'sophie.sun', 'jonas_jump', 'hanna.hype'];
function randomUser() { $('user').value = NAMES[Math.floor(Math.random() * NAMES.length)] + Math.floor(Math.random() * 100); }
function log(t) { const d = document.createElement('div'); d.textContent = new Date().toLocaleTimeString('de-DE') + '  ' + t; $('log').prepend(d); }
function connect() {
  const ws = new WebSocket(`ws://${location.host}`);
  ws.onclose = () => { $('mcText').textContent = 'Spielprogramm aus'; $('mcDot').className = 'dot'; setTimeout(connect, 2000); };
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.type === 'mc') { $('mcText').textContent = m.connected ? 'verbunden' : 'nicht verbunden'; $('mcDot').className = 'dot' + (m.connected ? ' on' : ''); }
    if (m.type === 'tiktok') { $('ttText').textContent = m.status; $('ttDot').className = 'dot' + (m.status.startsWith('verbunden') ? ' on' : ''); log('TikTok: ' + m.status); }
    if (m.type === 'state') {
      const s = m.state;
      $('houses').textContent = s.houses; $('citizens').textContent = s.citizens;
      $('comm').textContent = s.community ? `Gemeinschaftsbau ${s.community.name}: ${s.community.progress} / ${s.community.goal}` : 'Alle Gemeinschaftsbauten fertig';
      $('top').innerHTML = s.top.map((p) => `<li>@${esc(p.name)} – Stufe ${p.level} (${Math.floor(p.points)} UP)</li>`).join('');
    }
    if (m.type === 'speak' && m.on) log('Bürgermeister: ' + m.text);
    if (m.type === 'ticker') log('Laufband: ' + m.text);
    if (m.type === 'banner') log('Banner: ' + m.title + ' ' + m.text);
  };
}
connect();
</script>
</body>
</html>
