<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Meme City Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --panel: rgba(18, 16, 40, 0.82);
    --line: rgba(255, 255, 255, 0.14);
    --pink: #ff3d7f;
    --gold: #ffc93c;
    --mint: #3df5b0;
    --sky: #4cc9ff;
    --text: #ffffff;
    --muted: #b9b4e0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  body { font-family: 'Baloo 2', system-ui, sans-serif; color: var(--text); position: relative; }
  body.preview { background: linear-gradient(#6aa7ff, #9fd7ff 40%, #7bc66b 40.2%, #5aa04c); }
  .panel { background: var(--panel); border: 2px solid var(--line); border-radius: 28px; box-shadow: 0 10px 30px rgba(0,0,0,.35);  }

  /* ---------- Kopf ---------- */
  #head { position: absolute; top: 36px; left: 36px; right: 36px; display: flex; align-items: center; gap: 18px; padding: 14px 26px; }
  #logo { font-size: 66px; font-weight: 800; letter-spacing: 1px; line-height: 1; background: linear-gradient(90deg, var(--gold), var(--pink)); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
  #logo small { display: block; font-size: 22px; letter-spacing: 6px; color: var(--muted); -webkit-text-fill-color: var(--muted); }
  .chips { margin-left: auto; display: flex; gap: 12px; }
  .chip { padding: 8px 18px; border-radius: 18px; background: rgba(255,255,255,.08); text-align: center; min-width: 140px; }
  .chip b { display: block; font-size: 40px; line-height: 1; }
  .chip span { font-size: 18px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; }

  /* ---------- Bestenliste ---------- */
  #board { position: absolute; top: 262px; left: 36px; width: 370px; padding: 18px 20px; }
  .ptitle { font-size: 24px; font-weight: 800; letter-spacing: 3px; color: var(--gold); margin-bottom: 8px; }
  .row { display: flex; align-items: center; gap: 10px; padding: 5px 4px; font-size: 24px; border-radius: 12px; }
  .row .pos { width: 34px; text-align: center; font-weight: 800; color: var(--muted); }
  .row:nth-child(2) .pos { color: var(--gold); } .row:nth-child(3) .pos { color: #e3e3e3; } .row:nth-child(4) .pos { color: #e09a5a; }
  .row img, .row .ava { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: #3b3570; flex: none; }
  .row .nm { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 700; }
  .row .lv { font-size: 20px; color: var(--mint); white-space: nowrap; }

  /* ---------- Rechts: Ehrenbuergermeister + Gemeinschaftsbau ---------- */
  #right { position: absolute; top: 262px; right: 36px; width: 370px; display: flex; flex-direction: column; gap: 16px; }
  #honor { padding: 16px 20px; display: flex; align-items: center; gap: 14px; }
  #honor img, #honor .ava { width: 74px; height: 74px; border-radius: 50%; border: 4px solid var(--gold); object-fit: cover; background: #3b3570; }
  #honor .lbl { font-size: 19px; color: var(--gold); letter-spacing: 2px; font-weight: 800; }
  #honor .nm { font-size: 30px; font-weight: 800; line-height: 1.1; }
  #honor .sub { font-size: 20px; color: var(--muted); }
  #comm { padding: 16px 20px; }
  .bar { height: 26px; background: rgba(255,255,255,.1); border-radius: 13px; overflow: hidden; margin-top: 8px; }
  .bar i { display: block; height: 100%; width: 0; border-radius: 13px; background: linear-gradient(90deg, var(--mint), var(--sky)); transition: width .8s ease; }
  #gifts { position: absolute; left: 36px; right: 36px; top: 1110px; padding: 12px 22px; opacity: 0; transform: translateY(30px); transition: all .4s ease; border-color: var(--gold); }
  #gifts.show { opacity: 1; transform: none; }
  #gifts .rows2 { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 24px; }
  #gifts .g { display: flex; align-items: center; gap: 10px; font-size: 22px; padding: 3px 0; }
  #gifts .g .ic { width: 34px; text-align: center; font-size: 26px; }
  #gifts .g { font-size: 20px; }
  #gifts .g b { min-width: 0; }
  #gifts .tip { font-size: 16px; margin-top: 2px; }
  #gifts .g { padding: 1px 0; }
  #honor .nm { font-size: 26px; }
  #honor img, #honor .ava { width: 60px; height: 60px; }
  .row { font-size: 22px; }
  #gifts .g span { color: var(--mint); font-weight: 700; margin-left: auto; white-space: nowrap; }
  #gifts .tip { font-size: 19px; color: var(--muted); margin-top: 4px; }
  #comm .nums { display: flex; justify-content: space-between; font-size: 24px; font-weight: 700; }

  /* ---------- Like-Ziel / Duell ---------- */
  #goal { position: absolute; top: 178px; left: 36px; right: 36px; height: 68px; padding: 0 22px; display: flex; align-items: center; gap: 16px; opacity: 0; transition: opacity .4s; }
  #goal.show { opacity: 1; }
  #goal .lab { font-size: 26px; font-weight: 800; white-space: nowrap; }
  #goal .lab b { color: var(--gold); }
  #goal .gbar { flex: 1; height: 28px; border-radius: 14px; background: rgba(255,255,255,.1); overflow: hidden; position: relative; }
  #goal .gbar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 14px; background: linear-gradient(90deg, var(--pink), var(--gold)); transition: width .6s; }
  #goal .num { font-size: 26px; font-weight: 800; white-space: nowrap; }
  #goal.duel { border-color: #fff; }
  #goal.duel .gbar { background: #ff4d5e; }
  #goal.duel .gbar i { background: #3d8bff; border-radius: 0; }
  #goal .nord { color: #6fb0ff; } #goal .sued { color: #ff6b78; }
  #goal .next { font-size: 21px; font-weight: 800; color: var(--mint); white-space: nowrap; padding-left: 12px; border-left: 2px solid var(--line); }
  #goal.raffle { border-color: var(--gold); background: linear-gradient(90deg, rgba(255,201,60,.25), rgba(18,16,40,.85)); }
  #goal .time { font-size: 30px; font-weight: 800; color: var(--gold); min-width: 70px; text-align: right; }

  /* ---------- Pause ---------- */
  #pause { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity .8s;
    background: radial-gradient(circle at 50% 40%, #ff8a3d 0%, #ff3d7f 35%, #2a1660 80%); }
  #pause.show { opacity: 1; }
  #pause .box { text-align: center; margin-top: -200px; }
  #pause .logo { font-size: 150px; font-weight: 800; line-height: 1; color: #ffd84d; -webkit-text-stroke: 10px #1b1240; paint-order: stroke fill; }
  #pause .txt { font-size: 64px; font-weight: 800; margin-top: 30px; }
  #pause .sub { font-size: 44px; color: #ffe9f1; }
  #pause .dots::after { content: '...'; }
  #pause.show .dots::after { animation: dots 1.5s steps(4) infinite; }
  @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }

  /* ---------- Banner ---------- */
  #banner { position: absolute; top: 640px; left: 50%; transform: translate(-50%, -40px) scale(.8); opacity: 0; transition: all .45s cubic-bezier(.2,1.4,.4,1); padding: 22px 40px; display: flex; align-items: center; gap: 22px; min-width: 640px; border-color: var(--gold); }
  #banner.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
  #banner.big { background: linear-gradient(135deg, rgba(255,61,127,.92), rgba(255,140,40,.92)); }
  #banner img { width: 96px; height: 96px; border-radius: 50%; border: 4px solid #fff; object-fit: cover; }
  #banner .t { font-size: 46px; font-weight: 800; line-height: 1.05; }
  #banner .s { font-size: 30px; color: #fff4c9; }

  #almost { position: absolute; top: 880px; left: 50%; transform: translateX(-50%); padding: 12px 30px; font-size: 34px; font-weight: 800; color: #1b1240; background: var(--gold); border-radius: 22px; opacity: 0; transition: opacity .4s;  white-space: nowrap; }
  #almost.show { opacity: 1; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { transform: translateX(-50%) scale(1.06); } }

  /* ---------- Spieler-Karte ---------- */
  #player { position: absolute; left: 36px; right: 36px; top: 1180px; padding: 20px 24px; display: flex; gap: 20px; align-items: center; opacity: 0; transform: translateY(30px); transition: all .4s ease; }
  #player.show { opacity: 1; transform: none; }
  #player img, #player .ava { width: 120px; height: 120px; border-radius: 26px; object-fit: cover; border: 4px solid var(--pink); background: #3b3570; flex: none; }
  #player .info { flex: 1; min-width: 0; }
  #player .nm { font-size: 40px; font-weight: 800; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #player .lvl { font-size: 28px; color: var(--mint); font-weight: 700; }
  #player .need { font-size: 22px; color: var(--muted); margin-top: 4px; }
  #player .rank { text-align: center; font-size: 20px; color: var(--muted); }
  #player .rank b { display: block; font-size: 44px; color: var(--gold); line-height: 1; }

  /* ---------- Like-Statistik ---------- */
  #likestats { position: absolute; left: 36px; right: 36px; top: 1150px; padding: 18px 24px; opacity: 0; transform: translateY(30px); transition: all .4s ease; border-color: var(--pink); }
  #likestats.show { opacity: 1; transform: none; }
  #likestats .head { display: flex; align-items: baseline; gap: 14px; }
  #likestats .head .ptitle { color: var(--pink); margin: 0; }
  #likestats .head span { margin-left: auto; font-size: 22px; color: var(--muted); }
  #likestats .head span b { color: #fff; font-size: 30px; }
  #likestats .rows { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 22px; margin-top: 8px; }
  #likestats .r { display: flex; align-items: center; gap: 10px; font-size: 24px; font-weight: 700; min-width: 0; }
  #likestats .r .pos { width: 26px; color: var(--gold); font-weight: 800; }
  #likestats .r img, #likestats .r .ava { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: #3b3570; flex: none; }
  #likestats .r .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #likestats .r .n { color: var(--pink); white-space: nowrap; }

  /* ---------- Chat-Befehle ---------- */
  #help { position: absolute; left: 36px; right: 36px; top: 1130px; padding: 16px 24px; opacity: 0; transform: translateY(30px); transition: all .4s ease; border-color: var(--mint); }
  #help.show { opacity: 1; transform: none; }
  #help .ptitle { color: var(--mint); margin-bottom: 6px; }
  #help .cmds { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 20px; }
  #help .c { display: flex; gap: 10px; align-items: baseline; font-size: 21px; min-width: 0; }
  #help .c code { font-family: inherit; font-weight: 800; background: rgba(61,245,176,.15); color: var(--mint); padding: 0 10px; border-radius: 8px; white-space: nowrap; }
  #help .c span { color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- Buergermeister ---------- */
  #mayor { position: absolute; left: 36px; bottom: 140px; width: 1008px; height: 330px; display: flex; align-items: flex-end; gap: 0; }
  #mayorPic { width: 300px; height: 330px; position: relative; flex: none; }
  #mayorPic .frame { position: absolute; inset: 20px 10px 0 10px; border-radius: 34px; background: radial-gradient(circle at 50% 40%, #3a2f86, #1a1440); border: 4px solid var(--line); transition: box-shadow .2s, border-color .2s; }
  #mayor.talking .frame { border-color: var(--gold); box-shadow: 0 0 40px rgba(255,201,60,.65); }
  #mayorPic canvas { position: absolute; left: 0; bottom: 0; width: 300px; height: 330px; image-rendering: pixelated; border-radius: 0 0 34px 34px; }
  #mayorName { position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); background: var(--pink); padding: 2px 16px; border-radius: 14px; font-size: 20px; font-weight: 800; white-space: nowrap; }
  #bubble { margin: 0 0 90px 10px; padding: 18px 26px; font-size: 32px; font-weight: 700; line-height: 1.2; max-width: 680px; opacity: 0; transform: scale(.9); transform-origin: left bottom; transition: all .25s; position: relative; background: #fff; color: #1b1240; border: none; }
  #bubble::before { content: ''; position: absolute; left: -18px; bottom: 26px; border: 12px solid transparent; border-right: 18px solid #fff; border-left: none; }
  #mayor.talking #bubble { opacity: 1; transform: none; }
  @keyframes hop { 50% { transform: translateY(-18px); } }

  /* ---------- Laufband ---------- */
  #ticker { position: absolute; left: 0; right: 0; bottom: 50px; height: 70px; background: rgba(18,16,40,.9); border-top: 3px solid var(--pink); border-bottom: 3px solid var(--pink); overflow: hidden; }
  #ticker .lab { position: absolute; left: 0; top: 0; bottom: 0; z-index: 2; background: var(--pink); padding: 0 24px; font-size: 30px; font-weight: 800; display: flex; align-items: center; }
  #ticker .run { position: absolute; top: 0; height: 100%; display: flex; align-items: center; white-space: nowrap; font-size: 34px; font-weight: 700; left: 0; transform: translateX(1080px); will-change: transform; text-shadow: none; }
  #ticker .run.hl { color: var(--gold); }

  /* ---------- Likes + Konfetti ---------- */
  .like { position: absolute; right: 60px; bottom: 600px; width: 66px; height: 66px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 34px; animation: rise 2.6s ease-out forwards; }
  .like img { width: 100%; height: 100%; border-radius: 50%; border: 3px solid var(--pink); object-fit: cover; }
  .like::after { content: '♥'; position: absolute; right: -8px; bottom: -8px; color: var(--pink); font-size: 30px; text-shadow: 0 0 4px #000; }
  @keyframes rise { 0% { transform: translate(0,0) scale(.4); opacity: 0; } 15% { opacity: 1; transform: translate(0,-60px) scale(1); } 100% { transform: translate(var(--dx), -560px) scale(.8); opacity: 0; } }
  #confetti { position: absolute; inset: 0; pointer-events: none; }
  #status { position: absolute; top: 4px; right: 40px; font-size: 16px; color: var(--muted); }

  /* ---------- Lesbarkeit (fuers Handy): groessere Schrift, dunklere Tafeln, Schatten ---------- */
  :root { --panel: rgba(12, 10, 30, 0.93); --line: rgba(255, 255, 255, 0.28); --muted: #d6d2f5; }
  body { text-shadow: 0 2px 0 rgba(0,0,0,.75); } /* ohne Weichzeichner: viel weniger Rechenaufwand */
  .panel { border-width: 3px; }
  .ptitle { font-size: 30px; letter-spacing: 2px; }
  .chip b { font-size: 46px; } .chip span { font-size: 21px; }
  .row { font-size: 28px; padding: 6px 4px; } .row .lv { font-size: 25px; } .row img, .row .ava { width: 46px; height: 46px; }
  #honor .lbl { font-size: 22px; } #honor .nm { font-size: 32px; } #honor .sub { font-size: 23px; }
  #comm .nums { font-size: 29px; } .bar { height: 30px; }
  #goal { height: 78px; } #goal .lab, #goal .num { font-size: 30px; } #goal .next { font-size: 25px; } #goal .time { font-size: 34px; }
  #player .nm { font-size: 46px; } #player .lvl { font-size: 33px; } #player .need { font-size: 27px; color: #fff; } #player .rank { font-size: 23px; } #player .rank b { font-size: 50px; }
  #likestats .r, #help .c { font-size: 27px; } #likestats .head span { font-size: 25px; } #likestats .head span b { font-size: 34px; }
  #help .c span { color: #fff; }
  #banner .t { font-size: 52px; } #banner .s { font-size: 36px; }
  #bubble { font-size: 38px; text-shadow: none; }
  #ticker { height: 82px; } #ticker .lab { font-size: 34px; } #ticker .run { font-size: 42px; }
  #mayorName { font-size: 24px; }
  #almost { font-size: 38px; text-shadow: none; }

  /* ---------- Schoener Look ---------- */
  .panel { background: linear-gradient(180deg, rgba(48, 34, 110, 0.95) 0%, rgba(14, 11, 34, 0.94) 100%);
    box-shadow: 0 12px 30px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.18); overflow: hidden; }
  .panel::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 5px;
    background: linear-gradient(90deg, var(--pink), var(--gold), var(--mint), var(--sky)); }
  #board, #right > .panel, #head { position: relative; }
  #board { position: absolute; } #head { position: absolute; }
  #bubble::before { display: none; }
  #bubble { background: #fff; overflow: visible; }
  #bubble::after { content: ''; position: absolute; left: -18px; bottom: 26px; border: 12px solid transparent; border-right: 18px solid #fff; border-left: none; }
  #banner.big { background: linear-gradient(135deg, rgba(255,61,127,.96), rgba(255,140,40,.96)); }
  .ptitle { letter-spacing: 1px; white-space: nowrap; }
  #comm .ptitle { font-size: 23px; }
  #comm .cname { font-size: 34px; font-weight: 800; color: #fff; line-height: 1.1; margin: 2px 0 6px; }
  .bar { position: relative; box-shadow: inset 0 2px 4px rgba(0,0,0,.5); }
  .bar i { box-shadow: 0 0 14px rgba(61,245,176,.6);
    background-image: linear-gradient(90deg, var(--mint), var(--sky)), repeating-linear-gradient(45deg, rgba(255,255,255,.18) 0 12px, transparent 12px 24px);
    background-blend-mode: overlay; }
  #logo { text-shadow: 0 0 1px rgba(0,0,0,0); }

  /* Ehrenbuergermeister und Gemeinschaftsbau breiter (bis neben die Top 5) */
  #right { width: auto; left: 430px; right: 36px; }
  #honor .nm { font-size: 36px; } #comm .cname { font-size: 38px; }

  .like { background: none !important; font-size: 54px; will-change: transform, opacity; }
  .like::after { content: none; }
  .panel { contain: layout paint; }
  #bubble { contain: none; } /* sonst wird der Sprechblasen-Zipfel abgeschnitten */
  #player, #likestats, #help, #banner, #goal, #almost, #mayor, #bubble { will-change: transform, opacity; }
  .bar i { transition: width .4s linear; }

  body.bare > * { display: none !important; }


  /* ---------- Design-Feinschliff ---------- */
  :root { --panel-top: #3a2a8c; --panel-bot: #140f33; }
  .panel { background: linear-gradient(180deg, var(--panel-top) 0%, var(--panel-bot) 70%) !important; border: 2px solid rgba(255,255,255,.22) !important;
    box-shadow: 0 8px 22px rgba(0,0,0,.45) !important; border-radius: 26px; }
  .panel::before { height: 6px !important; }
  #board::before { background: linear-gradient(90deg, #ffc93c, #ff9f1c) !important; }
  #honor::before { background: linear-gradient(90deg, #ffd84d, #ff3d7f) !important; }
  #comm::before { background: linear-gradient(90deg, #3df5b0, #4cc9ff) !important; }
  #goal::before { background: linear-gradient(90deg, #ff3d7f, #ffc93c) !important; }
  #head::before { background: linear-gradient(90deg, #ff3d7f, #ffc93c, #3df5b0, #4cc9ff) !important; }
  /* Kopfzeile */
  #logo { background: linear-gradient(90deg, #ffe066, #ff8a3d 55%, #ff3d7f) !important; -webkit-background-clip: text !important; background-clip: text !important; color: transparent !important; }
  .chip { background: rgba(255,255,255,.10) !important; border: 2px solid rgba(255,255,255,.14); border-radius: 18px; }
  .chip b { color: #fff; }
  /* Top 5 mit Medaillen */
  .row { border-radius: 14px; margin: 2px 0; }
  .row:nth-child(1) { background: linear-gradient(90deg, rgba(255,201,60,.28), transparent); }
  .row:nth-child(2) { background: linear-gradient(90deg, rgba(220,220,235,.20), transparent); }
  .row:nth-child(3) { background: linear-gradient(90deg, rgba(224,154,90,.22), transparent); }
  .row .pos { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,.12); font-size: 22px; flex: none; }
  .row:nth-child(1) .pos { background: #ffc93c; color: #3a2400; } .row:nth-child(2) .pos { background: #dcdce8; color: #2a2a3a; } .row:nth-child(3) .pos { background: #e09a5a; color: #3a1f00; }
  .row img, .row .ava { border: 2px solid rgba(255,255,255,.5); }
  .row .lv { background: rgba(61,245,176,.16); padding: 0 10px; border-radius: 10px; }
  /* Ehrenbuergermeister */
  #honor img, #honor .ava { border: 4px solid #ffd84d; }
  /* Balken */
  .bar { background: rgba(0,0,0,.35) !important; border: 1px solid rgba(255,255,255,.12); }
  .bar i { background: linear-gradient(90deg, #3df5b0, #4cc9ff) !important; }
  #goal .gbar i { background: linear-gradient(90deg, #ff3d7f, #ffc93c) !important; }
  /* Spieler-Karte */
  #player { border-color: rgba(255,61,127,.6) !important; }
  #player img, #player .ava { border-radius: 24px; border: 4px solid #ff3d7f; }
  /* Laufband */
  #ticker { background: linear-gradient(90deg, #1c1250, #2a1868) !important; border-top: 3px solid #ff3d7f; border-bottom: 3px solid #ff3d7f; }
  #ticker .lab { background: linear-gradient(135deg, #ff3d7f, #ff7a45) !important; letter-spacing: 2px; }
  #ticker .run.hl { color: #ffd84d; }
  /* Sprechblase */
  #bubble { background: #fff !important; border-radius: 26px; box-shadow: 0 6px 16px rgba(0,0,0,.35) !important; color: #1b1240; }
  #mayorPic .frame { border-radius: 30px; }
  #mayorName { background: linear-gradient(90deg, #ff3d7f, #ff7a45); border: 2px solid #fff; }

  /* ---------- Kurze Animationen (laufen einmal, dann Ruhe) ---------- */
  .chip.bump { animation: bump .5s ease; }
  @keyframes bump { 40% { transform: scale(1.18); } }
  .row.rise { animation: rise 1.2s ease; }
  @keyframes rise { 0% { background: rgba(61,245,176,.55); transform: translateX(12px); } 100% { transform: none; } }
  #player .bar i { transition: width .9s cubic-bezier(.2,.8,.2,1); }
  #banner { overflow: hidden; }
  #banner.shine::after { content: ''; position: absolute; top: 0; bottom: 0; width: 120px; left: -160px;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.55), transparent); animation: shine .9s ease .2s 1 forwards; }
  @keyframes shine { to { left: 110%; } }
  #banner { transition: opacity .25s ease, transform .3s ease !important; }
  /* grosse Flaechen nur kurz und schlicht bewegen (LIVE Studio rechnet grosse Bewegungen langsam) */
  #help, #likestats, #player { transition: opacity .25s ease, transform .25s ease !important; }

  @keyframes pop { 0% { transform: scale(.7); } 100% { transform: scale(1); } }
  #ticker .run { transition: opacity .25s, transform .25s; }
  #ticker .run.out { transform: translateY(14px) !important; }

  /* ---------- Passt sich jeder Fenstergroesse an ----------
     LIVE Studio begrenzt die Hoehe des Link-Fensters manchmal (z. B. auf 960). Das Overlay wird
     dann komplett verkleinert statt unten abgeschnitten. */
  html { width: 100% !important; height: 100% !important; overflow: hidden !important; background: transparent; }
  body { position: absolute !important; left: 0; top: 0; width: 1080px !important; height: 1920px !important; transform-origin: 0 0; }

  /* ---------- Aufstiegs-Karte (einmalige Animation) ---------- */
  #levelup { position: absolute; left: 0; right: 0; top: 650px; height: 420px; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; }

  @keyframes lvShow { 0% { opacity: 0; transform: scale(.6); } 8% { opacity: 1; transform: scale(1.08); } 14% { transform: scale(1); } 85% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(.9) translateY(-30px); } }

  /* ---------- Laufband neu ---------- */
  #ticker { height: 96px !important; bottom: 40px !important; left: 24px !important; right: 24px !important; border-radius: 48px; overflow: hidden;
    background: linear-gradient(90deg, #22165e, #3a2290 60%, #22165e) !important; border: 3px solid rgba(255,255,255,.35) !important; }
  #ticker .lab { border-radius: 48px 0 0 48px; padding: 0 26px !important; gap: 10px; font-size: 32px !important; }

  #ticker .run { left: 150px !important; right: 24px !important; justify-content: flex-start !important; gap: 16px; font-size: 38px !important; font-weight: 700; color: #fff; }
  #ticker .run .ic { font-size: 44px; flex: none; }
  #ticker .run .tx { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  #ticker .run b { color: #ffd84d; font-weight: 800; }
  #ticker .run b.at { color: #7ff7cf; }
  #ticker .run.hl { color: #fff; }
  #ticker .run.hl .tx { color: #ffe9a8; }
  #ticker .run { transition: opacity .26s ease, transform .26s ease !important; }
  #ticker .run.out { opacity: 0; transform: translateY(-26px) !important; }
  #ticker .run.in { animation: tickIn .38s cubic-bezier(.2,1.4,.4,1); }
  @keyframes tickIn { 0% { opacity: 0; transform: translateY(30px); } 100% { opacity: 1; transform: none; } }
  #ticker .run.in .ic { animation: icPop .5s cubic-bezier(.2,1.8,.4,1); }
  @keyframes icPop { 0% { transform: scale(.3) rotate(-20deg); } 100% { transform: none; } }

  /* Laufband: Text laeuft nur innerhalb des Bandes */
  #tickbox { position: absolute; left: 150px; right: 18px; top: 0; bottom: 0; overflow: hidden; contain: strict; }
  #ticker .run { position: absolute !important; left: 0 !important; right: auto !important; top: 0; height: 100%; display: flex !important; align-items: center;
    white-space: nowrap; gap: 16px; transition: none !important; animation: none !important; opacity: 1 !important; will-change: transform; }
  #ticker .run .tx { overflow: visible !important; text-overflow: clip !important; }

  /* ---------- Uebersichtlich: kleinere Tafeln am Rand, Mitte frei fuers Spiel, Befehle immer sichtbar ---------- */
  #head { top: 22px !important; left: 22px !important; right: 22px !important; padding: 8px 20px !important; gap: 14px; }
  #logo { font-size: 50px !important; } #logo small { font-size: 16px !important; letter-spacing: 4px; }
  .chip { min-width: 112px !important; padding: 4px 12px !important; } .chip b { font-size: 36px !important; } .chip span { font-size: 16px !important; letter-spacing: 1px; }

  #cmdbar { position: absolute; top: 122px; left: 22px; right: 22px; padding: 10px 12px 10px; display: flex; flex-wrap: nowrap; align-items: center; justify-content: space-between; gap: 6px; }

  #cmdbar code.new { border-color: var(--gold); background: rgba(255,201,60,.22); }

  #goal { top: 196px !important; left: 22px !important; right: 22px !important; height: 62px !important; padding: 0 18px !important; }
  #goal .lab, #goal .num { font-size: 26px !important; } #goal .next { font-size: 22px !important; } #goal .time { font-size: 30px !important; }

  #board { top: 270px !important; left: 22px !important; width: 292px !important; padding: 10px 12px !important; }

  #board .row img, #board .row .ava { width: 32px !important; height: 32px !important; }

  /* Kamerawechsel wie in GTA: dunkler Rand und weisser Blitz */

    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,.6) 100%); }
  #gta.go { animation: gtaVig 3.6s ease forwards; }
  @keyframes gtaVig { 0% { opacity: 0; } 10% { opacity: 1; } 82% { opacity: 1; } 100% { opacity: 0; } }
  #gta.flash::after { content: ''; position: absolute; inset: 0; background: #fff; animation: gtaFlash .4s ease-out forwards; }
  @keyframes gtaFlash { 0% { opacity: .75; } 100% { opacity: 0; } }
  #cars { padding: 10px 12px; }
  #cars .ptitle { font-size: 17px; font-weight: 800; color: var(--gold); letter-spacing: 1px; }
  #cars .cr { display: flex; align-items: center; gap: 7px; font-size: 19px; font-weight: 800; margin-top: 5px; }
  #cars .cr img, #cars .cr .ava { width: 28px; height: 28px; border-radius: 50%; flex: none; }
  #cars .cr .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #cars .cb { height: 8px; border-radius: 4px; background: rgba(255,255,255,.12); overflow: hidden; margin: 2px 0 0 35px; }
  #cars .cb i { display: block; height: 100%; background: linear-gradient(90deg, #ffc93c, #ff7a3d); transition: width .6s; }
  #cars .hint { font-size: 16px; color: #cfd3ff; margin-top: 6px; }
  #cars .hint b { color: #fff; }

  /* Buergermeister kleiner in der Ecke */
  #mayor { bottom: 150px !important; transform: scale(.7); transform-origin: left bottom; }
  #bubble { max-width: 900px !important; font-size: 40px !important; }

  /* Einblendungen weiter unten und kompakter */

  #player img, #player .ava { width: 92px !important; height: 92px !important; }
  #player .nm { font-size: 38px !important; } #player .lvl { font-size: 28px !important; } #player .need { font-size: 23px !important; }
  #likestats { top: 1250px !important; left: 22px !important; right: 22px !important; padding: 12px 18px !important; }
  #likestats .r { font-size: 23px !important; } #likestats .r img, #likestats .r .ava { width: 32px !important; height: 32px !important; }
  #help { display: none !important; } /* ersetzt durch die feste Befehlsleiste oben */
  #banner { top: 760px !important; }
  #ticker { height: 80px !important; bottom: 36px !important; } #ticker .lab { font-size: 28px !important; } #ticker .run { font-size: 34px !important; }
  #tickbox { left: 130px !important; }
  /* Sofort-Rueckmeldung auf Chat-Befehle */
  #acks { position: absolute; left: 22px; top: 1080px; width: 760px; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }

    font-size: 26px; font-weight: 700; line-height: 1.15; animation: ackIn .3s cubic-bezier(.2,1.4,.4,1); transition: opacity .4s, transform .4s; }

<body>
<div id="pause"><div class="box"><div class="logo">MEME CITY</div><div class="txt" id="pauseText">Kurze Umbaupause</div><div class="sub">Gleich geht's weiter<span class="dots"></span></div></div></div>
<canvas id="confetti" width="1080" height="1920"></canvas>
<div id="status"></div>

<div id="head" class="panel">
  <div id="logo"><span id="cityName">MEME CITY</span><small>DEINE STADT · LIVE</small></div>
  <div class="chips">
    <div class="chip"><b id="houses">0</b><span>🏠 Häuser</span></div>
    <div class="chip"><b id="citizens">0</b><span>👥 Bürger</span></div>

<div id="cmdbar" class="panel"><span class="lbl">💬 SCHREIB:</span><code>Haus</code><code>zeig mein Haus</code><code>farbe rot</code><code class="new">haustier pinguin</code><code>party</code><code>nord / süd</code></div>

</div>

<div id="gta"></div>

  <div id="mayorPic">
    <div class="frame"></div>
    <canvas id="mayorCanvas" width="300" height="330"></canvas>
    <div id="mayorName">Bürgermeister Memo</div>
  </div>

</div>

<div id="ticker"><div class="lab"><span class="dot"></span>LIVE</div><div id="tickbox"><div class="run" id="run"><span class="ic">🏙️</span><span class="tx">Willkommen in Meme City!</span></div></div></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = (n) => Math.round(n).toLocaleString('de-DE');
const ava = (src, cls = 'ava') => src ? `<img src="${esc(src)}" referrerpolicy="no-referrer" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'${cls}'}))">` : `<div class="${cls}"></div>`;
if (location.search.includes('preview')) document.body.classList.add('preview');
function fitOverlay() {
  const s = Math.min(innerWidth / 1080, innerHeight / 1920) || 1;
  document.body.style.transform = `translate(${(innerWidth - 1080 * s) / 2}px, ${(innerHeight - 1920 * s) / 2}px) scale(${s})`;
}
addEventListener('resize', fitOverlay);
fitOverlay();

// ---------- Zustand ----------
const _html = {};
function setHTML(id, html) { if (_html[id] === html) return; _html[id] = html; $(id).innerHTML = html; }
// Zahl zaehlt kurz hoch und das Kaestchen huepft (einmalig, danach Ruhe)
const _num = {};
function countTo(id, to) {
  const el = $(id), from = _num[id];
  _num[id] = to;
  if (from === undefined || from === to) { el.textContent = fmt(to); return; }
  const start = performance.now(), dur = 700;
  const step = (t) => { const k = Math.min(1, (t - start) / dur); el.textContent = fmt(from + (to - from) * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
  if (to > from) { const chip = el.parentElement; chip.classList.remove('bump'); void chip.offsetWidth; chip.classList.add('bump'); }
}
// Wer in der Top 5 aufsteigt, leuchtet kurz auf
let _lastTop = [];
function flashRisers(top) {
  const names = top.slice(0, 5).map((p) => p.name);
  requestAnimationFrame(() => {
    [...document.querySelectorAll('#rows .row')].forEach((row, i) => {
      const before = _lastTop.indexOf(names[i]);
      if (_lastTop.length && (before === -1 || before > i)) { row.classList.remove('rise'); void row.offsetWidth; row.classList.add('rise'); }
    });
    _lastTop = names;
  });
}
function renderState(s) {
  $('cityName').textContent = (s.city || 'Meme City').toUpperCase();
  $('mayorName').textContent = s.mayorName;
  countTo('houses', s.houses); countTo('citizens', s.citizens); countTo('pets', s.pets || 0);
  flashRisers(s.top);
  setHTML('rows', s.top.length ? s.top.slice(0, 5).map((p, i) => `<div class="row"><div class="pos">${i + 1}</div>${ava(p.avatar)}<div class="nm">@${esc(p.name)}</div><div class="lv">St. ${p.level}</div></div>`).join('')
    : '<div class="row" style="color:var(--muted)">Noch keine Häuser – schreib „Haus“!</div>');
  setHTML('honor', s.honorary
    ? `${ava(s.honorary.avatar)}<div><div class="lbl">👑 EHRENBÜRGERMEISTER</div><div class="nm">@${esc(s.honorary.name)}</div><div class="sub">Platz 1 der Stadt</div></div>`
    : `<div class="ava"></div><div><div class="lbl">👑 EHRENBÜRGERMEISTER</div><div class="nm">Noch frei!</div><div class="sub">Wer wird es?</div></div>`);
  setHTML('comm', s.community
    ? `<div class="ptitle">🏗️ GEMEINSCHAFTSBAU</div><div class="cname">${esc(s.community.name)}</div><div class="nums"><span>${fmt(s.community.progress)} / ${fmt(s.community.goal)}</span><span>${Math.floor(100 * s.community.progress / s.community.goal)} %</span></div><div class="bar"><i style="width:${Math.min(100, 100 * s.community.progress / s.community.goal)}%"></i></div>`
    : `<div class="ptitle">🏗️ ALLE GEMEINSCHAFTSBAUTEN FERTIG!</div>`);
}

function renderGifts(s) {
  // Reine Spielregel-Info (TikTok-konform): beschreibt, was passiert – keine Aufforderung.
  const rows = [
    ['🌹', 'Rose', 'Blume im Garten'],
    ['🫰', 'Fingerherz', 'Riesen-Herz'],
    ['🍩', 'Donut', 'Riesen-Donut'],
    ['🌸', 'Parfüm', 'Blütenregen'],
    ['🚀', 'Rakete', 'Raketen vom Dach'],
    ['🌌', 'Galaxie', 'Sternennacht'],
    ['🗿', 'ab 1.000', 'Denkmal am Platz'],
    ['👑', 'Platz 1', 'Goldene Krone'],
  ];
  $('gifts').innerHTML = ''; // abgeschaltet
}

// ---------- Spieler-Karte ----------
let playerTimer;
function showPlayer(c) {
  const need = c.nextLevel
    ? `Noch <b>${fmt(c.likesNeeded)} Likes</b> bis Stufe ${c.nextLevel} · ${esc(c.nextName)}`
    : 'Höchste Stufe erreicht! 👑';
  $('player').innerHTML = `${ava(c.avatar)}<div class="info"><div class="nm">@${esc(c.name)}</div>
    <div class="lvl">${c.hasHouse ? `Stufe ${c.level} · ${esc(c.levelName)}` : 'Noch kein Haus – schreib „Haus“!'}</div>
    <div class="bar"><i style="width:${Math.round(c.progress * 100)}%"></i></div><div class="need">${need}</div></div>
    ${c.hasHouse ? `<div class="rank">Platz<b>#${c.rank}</b>von ${fmt(c.houses)}</div>` : ''}`;
  $('player').classList.add('show');
  const pb = $('player').querySelector('.bar i'); if (pb) { const w = pb.style.width; pb.style.width = '0%'; requestAnimationFrame(() => requestAnimationFrame(() => { pb.style.width = w; })); }
  clearTimeout(playerTimer);
  playerTimer = setTimeout(() => $('player').classList.remove('show'), 9000);
}

// ---------- Like-Statistik ----------
let statsTimer;
function showLikeStats(s) {
  $('likestats').innerHTML = `<div class="head"><div class="ptitle">❤️ TOP-LIKER HEUTE</div>
    <span><b>${fmt(s.total)}</b> Likes · <b>${fmt(s.perMin)}</b>/Min · ${fmt(s.likers)} Fans</span></div>
    <div class="rows">${s.top.map((p, i) => `<div class="r"><div class="pos">${i + 1}</div>${ava(p.avatar)}<div class="nm">@${esc(p.name)}</div><div class="n">${fmt(p.likes)} ♥</div></div>`).join('')}</div>`;
  $('player').classList.remove('show'); $('help').classList.remove('show');
  $('likestats').classList.add('show');
  clearTimeout(statsTimer);
  statsTimer = setTimeout(() => $('likestats').classList.remove('show'), 9000);
}

// ---------- Like-Ziel und Duell ----------
let duelUntil = 0;
function showGoal(g) {
  if (Date.now() < duelUntil) return;
  const el = $('goal');
  el.className = 'panel show';
  const pct = Math.min(100, (100 * g.cur) / g.target);
  const html = `<div class="lab">🎯 <b>${esc(g.name)}</b></div><div class="gbar"><i style="width:${pct}%"></i></div><div class="num">${fmt(g.cur)} / ${fmt(g.target)} ♥</div>${g.next ? `<div class="next">${esc(g.next)}</div>` : ''}`;
  if (el._h !== html) { el._h = html; el.innerHTML = html; }
}
function showRaffle(r) {
  const el = $('goal');
  el._h = null;
  duelUntil = Date.now() + (r.end ? 8000 : 3000);
  el.className = 'panel show raffle';
  el.innerHTML = r.end
    ? `<div class="lab">🎉 GEWINNER: <b>@${esc(r.winner)}</b></div><div class="gbar"><i style="width:100%"></i></div><div class="num">${fmt(r.count)} dabei</div>`
    : `<div class="lab">🎟️ VERLOSUNG – schreib <b>„ich“</b></div><div class="gbar"><i style="width:${(100 * r.left) / 60}%"></i></div><div class="num">${fmt(r.count)} dabei</div><div class="time">${r.left}s</div>`;
}
function showVote(v) {
  const el = $('goal');
  el._h = null;
  duelUntil = Date.now() + (v.end ? 8000 : 3000);
  el.className = 'panel show raffle';
  if (v.end) { el.innerHTML = `<div class="lab">🗳️ ES WIRD: <b>${esc(v.winner)}</b>!</div><div class="gbar"><i style="width:100%"></i></div><div class="num">${fmt(v.count)} Stimmen</div>`; return; }
  el.innerHTML = `<div class="lab">🗳️ SCHREIB</div>${v.options.map((o, i) => `<div class="lab" style="font-size:24px;white-space:nowrap"><b>${i + 1}</b> ${esc(o)} <span style="color:var(--mint)">${v.counts[i]}</span></div>`).join('')}<div class="time" style="margin-left:auto">${v.left}s</div>`;
}

// ---------- Laufband ----------
// Kein Dauer-Scrollen mehr: LIVE Studio rechnet ohne Grafikkarte und schafft bei
// staendiger Bewegung nur ~8 Bilder/s fuer das ganze Overlay. Stattdessen wechselt der
// Text alle paar Sekunden mit kurzem Einblenden – danach ist alles wieder ruhig.
const tickerQueue = [];
// Standard-Texte: [Symbol, Text mit **hervorgehobenen** Stellen]
const tickerDefaults = [
  ['🏙️', 'Willkommen in **Meme City** – der Stadt, die ihr baut!'],
  ['🏠', 'Schreib **Haus** und bekomm dein eigenes Grundstück'],
  ['✈️', 'Schreib **zeig mein Haus** – die Kamera fliegt hin'],
  ['🎨', '**farbe rot** streicht dein Dach neu'],
  ['🐶', '**haustier hund** – dein Tier zieht ein'],
  ['🎉', '**party** = Feuerwerk an deinem Haus'],
  ['❤️', 'Jedes **Like** lässt dein Haus wachsen'],
  ['⚔️', 'Schreib **nord** oder **süd** fürs Team-Duell'],
  ['❓', 'Frag den Bürgermeister – er antwortet!'],
];
let tickerIdx = 0;
function ticker(text, hl) {
  tickerQueue.push({ text, hl });
  if (tickerQueue.length > 6) tickerQueue.shift();
}
// Symbol am Anfang eines Textes abtrennen (z. B. "❤️ @lena hat ...")
function splitIcon(t) {
  const m = String(t).match(/^(\p{Extended_Pictographic}[️‍\p{Extended_Pictographic}]*)\s*(.*)$/u);
  return m ? [m[1], m[2]] : [null, String(t)];
}
function fmtTicker(t) {
  return esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(@[\w.]+)/g, '<b class="at">$1</b>');
}
// Laufband: Text laeuft LANGSAM von rechts nach links durch das Band (nur innerhalb des Bandes,
// das spart Rechenzeit in LIVE Studio). Danach kommt die naechste Meldung.
const TICK_SPEED = 85; // Pixel pro Sekunde (langsam, gut lesbar)
function nextTicker() {
  let icon, text, hl = false;
  const item = tickerQueue.shift();
  if (item) { [icon, text] = splitIcon(item.text); hl = item.hl; icon = icon || (hl ? '⭐' : '📣'); }
  else { [icon, text] = tickerDefaults[tickerIdx++ % tickerDefaults.length]; }
  const run = $('run'), box = $('tickbox');
  run.innerHTML = `<span class="ic">${icon}</span><span class="tx">${fmtTicker(text)}</span>`;
  run.className = 'run' + (hl ? ' hl' : '');
  const W = box.clientWidth, w = run.scrollWidth;
  const dur = ((W + w) / TICK_SPEED) * 1000;
  const anim = run.animate([{ transform: `translateX(${W}px)` }, { transform: `translateX(${-w}px)` }], { duration: dur, easing: 'linear' });
  anim.onfinish = () => setTimeout(nextTicker, 300);
}
nextTicker();

// ---------- Buergermeister ----------
let mouthTimer, poseTimer;
function talk(on, text, silent) {
  const m = $('mayor');
  clearInterval(mouthTimer);
  if (on) {

    m.classList.add('talking');
    m.classList.remove('open');
    // ohne Ton bewegt sich der Mund nicht (nur Sprechblase)
    if (!silent) mouthTimer = setInterval(() => m.classList.toggle('open', Math.random() > 0.35), 110);
    if (!m.classList.contains('cheer')) mayorPose(Math.random() > 0.5 ? 'point' : '', 1800);
  } else {
    m.classList.remove('talking', 'open');

}
function mayorPose(pose, ms) {

  m.classList.remove('point', 'cheer');
  if (pose) m.classList.add(pose);
  clearTimeout(poseTimer);
  poseTimer = setTimeout(() => m.classList.remove('point', 'cheer'), ms);

// ---------- Buergermeister aus dem Minecraft-Skin zeichnen ----------
const mcv = $('mayorCanvas'), mctx = mcv.getContext('2d');
const skin = new Image();
let slim = false, armL = 0, armR = 0, hop = 0, hopT = 0, blink = 0;
skin.onload = () => {
  try { // schmale Arme (Alex-Modell) erkennen
    const t = document.createElement('canvas'); t.width = 64; t.height = 64;
    const c = t.getContext('2d'); c.drawImage(skin, 0, 0);
    slim = c.getImageData(54, 20, 1, 1).data[3] === 0;
  } catch {}
  requestAnimationFrame(drawMayor);
};
skin.src = '/skin.png';

function part(sx, sy, sw, sh, dx, dy, s) {
  mctx.drawImage(skin, sx, sy, sw, sh, dx, dy, sw * s, sh * s);
}
let lastDraw = 0;
function drawMayor(t) {
  if (window.__bare) { requestAnimationFrame(drawMayor); return; }
  if (t - lastDraw < 66) { requestAnimationFrame(drawMayor); return; } // hoechstens 15 Bilder pro Sekunde
  { const mm = $('mayor'); const active = mm.classList.contains('talking') || mm.classList.contains('cheer') || mm.classList.contains('point') || Math.abs(armR) > 0.02 || Math.abs(armL) > 0.02 || hop > 0.2;
    if (!active && window.__idleDrawn) { requestAnimationFrame(drawMayor); return; }
    window.__idleDrawn = !active; }
  lastDraw = t;
  const m = $('mayor');
  const s = 13, aw = slim ? 3 : 4;
  const talking = m.classList.contains('talking');
  const cheer = m.classList.contains('cheer'), point = m.classList.contains('point');
  // Ziel-Winkel der Arme (Bogenmass), weich angleichen
  const targetR = cheer ? -2.6 : point ? -1.9 : talking ? -0.25 + Math.sin(t / 260) * 0.15 : 0;
  const targetL = cheer ? 2.6 : talking ? 0.12 + Math.sin(t / 310) * 0.08 : 0;
  armR += (targetR - armR) * 0.18; armL += (targetL - armL) * 0.18;
  hop = cheer ? Math.abs(Math.sin(t / 140)) * 16 : hop * 0.8;
  const breathe = 0; // kein Dauer-Atmen (spart Rechenzeit)

  mctx.clearRect(0, 0, 300, 330);
  mctx.imageSmoothingEnabled = false;
  const bx = 150 - 4 * s, hy = 44 - hop + breathe, by = hy + 8 * s;

  // Beine
  part(4, 20, 4, 12, bx, by + 12 * s, s); part(20, 52, 4, 12, bx + 4 * s, by + 12 * s, s);
  part(4, 36, 4, 12, bx, by + 12 * s, s); part(4, 52, 4, 12, bx + 4 * s, by + 12 * s, s);
  // Koerper
  part(20, 20, 8, 12, bx, by, s); part(20, 36, 8, 12, bx, by, s);
  // Arme (gedreht an der Schulter)
  const arm = (sx, sy, ox, oy, x, angle) => {
    mctx.save();
    mctx.translate(x + (aw * s) / 2, by + s * 1.5);
    mctx.rotate(angle);
    part(sx, sy, aw, 12, -(aw * s) / 2, -s * 1.5, s);
    part(ox, oy, aw, 12, -(aw * s) / 2, -s * 1.5, s);
    mctx.restore();
  };
  arm(44, 20, 44, 36, bx - aw * s, armL);       // rechter Arm der Figur (links im Bild)
  arm(36, 52, 52, 52, bx + 8 * s, armR);        // linker Arm der Figur (rechts im Bild, zeigt/jubelt)
  // Kopf + Hut-Ebene
  const tilt = talking ? Math.sin(t / 180) * 0.04 : 0;
  mctx.save();
  mctx.translate(150, hy + 8 * s);
  mctx.rotate(tilt);
  mctx.translate(-150, -(hy + 8 * s));
  part(8, 8, 8, 8, bx, hy, s);
  // Mund: dunkles Rechteck unten im Gesicht, solange er spricht
  if (m.classList.contains('open')) {
    const h = 0.8 + Math.random() * 0.7;
    mctx.fillStyle = '#2a0f12';
    mctx.fillRect(bx + 3 * s, hy + 6 * s, 2 * s, h * s);
    mctx.fillStyle = '#c23a4a';
    mctx.fillRect(bx + 3.3 * s, hy + (6 + h * 0.55) * s, 1.4 * s, h * 0.4 * s);
  }
  part(40, 8, 8, 8, bx - 0.5 * s, hy - 0.5 * s, s * 1.125);
  mctx.restore();
  requestAnimationFrame(drawMayor);
}

// ---------- Likes ----------
let likeCount = 0;
function likeBubble(l) {
  // nur ein schlichtes Herz (keine Profilbilder laden) und hoechstens 5 gleichzeitig
  if (document.querySelectorAll('.like').length >= 5) return;
  const d = document.createElement('div');

// ---------- Konfetti ----------
const cv = $('confetti'), cx = cv.getContext('2d');
let parts = [];
function confetti(n) {
  n = Math.min(n, 40);
  if (parts.length > 150) return;
  const cols = ['#ff3d7f', '#ffc93c', '#3df5b0', '#4cc9ff', '#ffffff', '#b06bff'];
  for (let i = 0; i < n; i++) parts.push({ x: 150 + Math.random() * 200, y: 1500, vx: (Math.random() - 0.2) * 14, vy: -14 - Math.random() * 16, r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.4, c: cols[i % cols.length], s: 8 + Math.random() * 10 });
  if (parts.length === n) requestAnimationFrame(tick);
}
function tick() {
  cx.clearRect(0, 0, 1080, 1920);
  parts = parts.filter((p) => p.y < 1950);
  for (const p of parts) {
    p.vy += 0.45; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); cx.restore();
  }
  if (parts.length) requestAnimationFrame(tick);
}

// ---------- Verbindung zum Spielprogramm ----------
function connect() {
  const ws = new WebSocket(`ws://${location.host}`);
  ws.onopen = () => { $('status').textContent = ''; };
  ws.onclose = () => { $('status').textContent = 'Spielprogramm nicht verbunden …'; setTimeout(connect, 2000); };
  // Messwerte ans Programm (nur zur Fehlersuche): Sichtbarkeit, Timer-Verzoegerung, Bilder pro Sekunde
  let frames = 0; const countFrame = () => { frames++; requestAnimationFrame(countFrame); }; requestAnimationFrame(countFrame);
  let lastTick = performance.now();
  clearInterval(window.__diag);
  window.__diag = setInterval(() => {
    const now = performance.now(), drift = Math.round(now - lastTick - 2000); lastTick = now;
    if (ws.readyState === 1) ws.send(JSON.stringify({ type: 'diag', vis: document.visibilityState, hidden: document.hidden, drift, fps: Math.round(frames / 2), w: innerWidth, h: innerHeight, dpr: devicePixelRatio, sw: screen.width, sh: screen.height, ua: navigator.userAgent.slice(-60) }));
    frames = 0;
  }, 2000);
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.type === 'css') { let st = document.getElementById('__css'); if (!st) { st = document.createElement('style'); st.id = '__css'; document.head.appendChild(st); } st.textContent = m.css || ''; }
    if (m.type === 'hidesel') { let st = document.getElementById('__hs'); if (!st) { st = document.createElement('style'); st.id = '__hs'; document.head.appendChild(st); } st.textContent = m.sel ? m.sel + ' { display: none !important; }' : ''; }
    if (m.type === 'bare') { document.body.classList.toggle('bare', !!m.on); window.__bare = !!m.on; }
    if (m.type === 'hello') { if (window.__v && window.__v !== m.version) location.reload(); window.__v = m.version; }
    if (m.type === 'state') { renderState(m.state); renderGifts(m.state); }
    else if (m.type === 'player') { ['likestats', 'help', 'gifts'].forEach((id) => $(id).classList.remove('show')); showPlayer(m.card); }
    else if (m.type === 'likestats') showLikeStats(m);
    else if (m.type === 'goal') showGoal(m);
    else if (m.type === 'cars') showCars(m);
    else if (m.type === 'gta') gtaFx(m.phase);
    // Top-Unterstuetzer-Tafel abgeschaltet (zeigte Coins)
    else if (m.type === 'help') showHelp();
    else if (m.type === 'duel') showDuel(m);
    else if (m.type === 'raffle') showRaffle(m);
    else if (m.type === 'vote') showVote(m);
    else if (m.type === 'ack') showAck(m);
    else if (m.type === 'pause') { if (m.text) $('pauseText').textContent = m.text; $('pause').classList.toggle('show', !!m.on); }
    else if (m.type === 'banner') showBanner(m);
    else if (m.type === 'almost') showAlmost(m.card);
    else if (m.type === 'levelup') showLevelUp(m);
    else if (m.type === 'ticker') ticker(m.text, m.highlight);
    else if (m.type === 'speak') talk(m.on, m.text, m.silent);
    else if (m.type === 'likes') likeBubble(m);
    else if (m.type === 'confetti') confetti(m.amount);
  };
}
connect();
</script>
